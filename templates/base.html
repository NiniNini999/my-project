<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERITY // MY SITE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #e8e8d0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        /* scanline overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                0deg, rgba(0,0,0,0.15), rgba(0,0,0,0.15) 1px,
                transparent 1px, transparent 2px
            );
            pointer-events: none;
            z-index: 999;
        }
        nav {
            background: #0a0a0a;
            border-bottom: 1px solid #d4c93a;
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        nav .brand {
            font-weight: bold;
            font-size: 1.2em;
            letter-spacing: 3px;
            color: #d4c93a;
            text-decoration: none;
            text-shadow: 0 0 8px rgba(212, 201, 58, 0.6);
        }
        nav .brand::before { content: '◉ '; }
        nav .links a, nav .links button {
            color: #999980;
            text-decoration: none;
            margin-left: 22px;
            font-size: 0.85em;
            letter-spacing: 1px;
            background: none; border: none; cursor: pointer; font-family: inherit;
        }
        nav .links a:hover, nav .links button:hover { color: #d4c93a; }
        main { max-width: 680px; margin: 50px auto; padding: 0 20px; }
        .glitch-title {
            font-size: 2.4em;
            color: #d4c93a;
            letter-spacing: 1px;
            text-shadow: 2px 0 #ff2e2e, -2px 0 #2effea;
            margin-bottom: 10px;
        }
        p { color: #999980; line-height: 1.6; }
        h2 {
            color: #d4c93a;
            font-size: 0.9em;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 36px;
            border-bottom: 1px dashed #333;
            padding-bottom: 8px;
        }
        .post {
            background: #0d0d0a;
            border: 1px solid #333;
            border-left: 3px solid #d4c93a;
            padding: 20px;
            margin: 14px 0;
        }
        .post h3 { color: #e8e8d0; margin-bottom: 8px; }
        .post p { color: #999980; }
        .post small { color: #555; }
        .btn-primary {
            display: inline-block;
            background: #d4c93a;
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
        }
        .btn-primary:hover { background: #e8e8d0; }
        form input, form textarea {
            width: 100%;
            padding: 10px;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #e8e8d0;
            font-family: inherit;
            margin-top: 4px;
        }
        form input:focus, form textarea:focus { outline: none; border-color: #d4c93a; }
        label { color: #666; font-size: 0.8em; letter-spacing: 1px; text-transform: uppercase; }

        /* simple drawn smiley, not the actual character art */
        .orb {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f5e97a, #c9ba1f);
            margin: 0 auto 24px;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 201, 58, 0.4);
        }
        .orb::before, .orb::after {
            content: '';
            position: absolute;
            width: 8px; height: 8px;
            background: #000;
            border-radius: 50%;
            top: 34px;
        }
        .orb::before { left: 26px; }
        .orb::after { right: 26px; }
        .orb-mouth {
            position: absolute;
            width: 34px; height: 17px;
            border-bottom: 4px solid #000;
            border-radius: 0 0 40px 40px;
            top: 48px; left: 28px;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="brand">VERITY</a>
        <div class="links">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">{{ user.username }}</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">logout</button>
                </form>
                <a href="{% url 'create_post' %}">new_entry</a>
            {% else %}
                <a href="{% url 'login' %}">login</a>
                <a href="{% url 'signup' %}">join</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
