<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #08080c;
            color: #e8e8ed;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; }

        /* Nav */
        nav {
            background: rgba(8, 8, 12, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        nav .brand {
            font-weight: 800;
            font-size: 1.15em;
            letter-spacing: -0.3px;
            text-decoration: none;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav .brand::before {
            content: '';
            width: 9px; height: 9px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            display: inline-block;
        }
        nav .links { display: flex; align-items: center; gap: 28px; }
        nav .links a, nav .links button {
            color: #9999a8;
            text-decoration: none;
            font-size: 0.88em;
            font-weight: 500;
            transition: color 0.15s;
            background: none; border: none; cursor: pointer; font-family: inherit;
        }
        nav .links a:hover, nav .links button:hover { color: #fff; }
        .nav-cta {
            background: #fff !important;
            color: #08080c !important;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600 !important;
        }
        .nav-cta:hover { background: #e5e5e5 !important; }

        /* Layout */
        main { flex: 1; }
        .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

        /* Hero */
        .hero {
            text-align: center;
            padding: 110px 24px 90px;
            background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124, 58, 237, 0.18), transparent);
        }
        .hero .eyebrow {
            display: inline-block;
            font-size: 0.75em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a78bfa;
            background: rgba(124, 58, 237, 0.12);
            border: 1px solid rgba(124, 58, 237, 0.3);
            padding: 6px 14px;
            border-radius: 100px;
            margin-bottom: 24px;
        }
        .hero h1 {
            font-size: 3.4em;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1.08;
            color: #fff;
            max-width: 640px;
            margin: 0 auto 20px;
        }
        .hero p {
            font-size: 1.15em;
            color: #9999a8;
            max-width: 480px;
            margin: 0 auto 36px;
        }
        .hero-ctas { display: flex; gap: 14px; justify-content: center; }

        /* Buttons */
        .btn-primary {
            display: inline-block;
            background: #fff;
            color: #08080c;
            padding: 13px 26px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 0.92em;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(255,255,255,0.15); }
        .btn-secondary {
            display: inline-block;
            background: rgba(255,255,255,0.06);
            color: #fff;
            padding: 13px 26px;
            border-radius: 9px;
            text-decoration: none;
            font-size: 0.92em;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.12);
            transition: background 0.15s;
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }

        /* Section */
        .section { padding: 60px 24px; }
        .section-label {
            font-size: 0.78em;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #7c3aed;
            font-weight: 700;
            margin-bottom: 28px;
        }

        /* Posts */
        .post {
            background: #101014;
            border-radius: 16px;
            padding: 26px;
            margin: 14px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: border-color 0.2s, transform 0.2s;
        }
        .post:hover { border-color: rgba(124, 58, 237, 0.4); transform: translateY(-2px); }
        .post h3 { font-size: 1.15em; color: #fff; font-weight: 700; margin-bottom: 8px; }
        .post p { color: #b3b3c2; margin-bottom: 12px; }
        .post small { color: #666677; font-weight: 600; font-size: 0.8em; letter-spacing: 0.3px; }

        /* Forms */
        .card {
            background: #101014;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 18px;
            padding: 40px;
            max-width: 440px;
            margin: 50px auto;
        }
        .card h1 { font-size: 1.6em; margin-bottom: 6px; color: #fff; }
        .card > p { color: #8888a0; margin-bottom: 24px; font-size: 0.9em; }
        form p { margin: 16px 0; }
        label { font-size: 0.78em; color: #8888a0; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; display: block; margin-bottom: 6px; }
        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: #08080c;
            color: #e8e8ed;
            font-size: 0.95em;
            font-family: inherit;
        }
        input:focus, textarea:focus { outline: none; border-color: #7c3aed; }
        textarea { min-height: 110px; }
        form button[type="submit"] { width: 100%; margin-top: 8px; padding: 13px; }

        /* Footer */
        footer {
            border-top: 1px solid rgba(255,255,255,0.06);
            padding: 32px 40px;
            text-align: center;
            color: #555566;
            font-size: 0.82em;
        }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}" class="brand">MYSITE</a>
        <div class="links">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">{{ user.username }}</a>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
                <a href="{% url 'create_post' %}" class="nav-cta">New Post</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}" class="nav-cta">Get Started</a>
            {% endif %}
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>© 2026 MySite. Built with Django.</footer>
</body>
</html>
